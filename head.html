
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Lab Academic Registry</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #101b36;
    color: white;
}

.header {
    min-height: 155px;
    padding: 22px 4%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    border-bottom: 3px solid #e8c778;
}

.details {
    flex: 1;
}

h1 {
    font-size: clamp(19px, 2.5vw, 30px);
    color: #e8c778;
    letter-spacing: 1px;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 13px;
    color: #d6deed;
    line-height: 1.8;
}

.profile {
    display: flex;
    align-items: center;
    gap: 14px;
}

.profile-info {
    text-align: right;
}

.profile-info h2 {
    font-size: 16px;
    color: white;
    margin-bottom: 6px;
}

.profile-info p {
    font-size: 12px;
    color: #d6deed;
    line-height: 1.7;
}

.profile-pic {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #e8c778;
    background: #263552;
}

@media (max-width: 650px) {
    .header {
        flex-wrap: wrap;
    }

    .profile {
        margin-left: auto;
    }

    h1 {
        font-size: 20px;
    }
}
</style>
</head>

<body>
<header class="header">

    <div class="details">
        <h1>JAVA LAB ACADEMIC REGISTRY</h1>
        <p class="subtitle">
            Department of Artificial Intelligence<br>
            B.Tech Academic Session 2025–2029
        </p>
    </div>

    <div class="profile">
        <div class="profile-info">
            <h2>J. Vijay Raj</h2>
            <p>
                B.Tech Artificial Intelligence & Machine Learning<br>
                Roll No: 25EU02080<br>
                2025–2029
            </p>
        </div>

        <img
            src="vijay raj.jpeg"
            alt="Student Profile Picture"
            class="profile-pic"
        >
    </div>

</header>
</body>
</html>
